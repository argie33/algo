name: CI

# ADDED 2026-08-20: this file never existed despite steering/GOVERNANCE.md and
# .pre-commit-config.yaml both assuming it does (GOVERNANCE.md: "Enforcement is per-commit
# via pre-commit hooks and CI (.github/workflows/ci.yml)"; .pre-commit-config.yaml's own
# comments: "Security scanning moved to CI... Bandit runs async in GitHub Actions instead",
# "real enforcement is CI's own step (.github/workflows/ci.yml, uses the official
# trufflesecurity/trufflehog Action)"). Until now there was zero server-side enforcement of
# any of these rules - only whatever ran locally via pre-commit, skippable with --no-verify
# or simply not installed. Mirrors exactly what Makefile's `make ci-local` already documents
# as "matching CI" - see that file for the equivalent local commands.
#
# Deliberately does NOT include deployment. GOVERNANCE.md's "git push main -> deploy-all-
# infrastructure.yml (auto)" claim is also currently false (that file doesn't exist either) -
# left for a dedicated follow-up given the blast radius of wiring real AWS deploy credentials
# into a workflow, which is a materially different risk category from running checks.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-quality:
    name: Python lint + type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check algo/ tests/ tools/ loaders/ utils/ config/ lambda/
      - name: Ruff format check
        run: ruff format --check algo/ tests/ tools/ loaders/ utils/ config/ lambda/
      - name: MyPy (core)
        run: |
          mypy algo/ loaders/ utils/ config/ dashboard/ monitoring/ lambda/base_handler.py lambda/algo_orchestrator/lambda_function.py lambda/monitoring/health_monitor.py lambda/monitoring/loader_failure_handler.py --show-error-codes
      - name: MyPy (lambda/api)
        run: cd lambda/api && mypy . --ignore-missing-imports --show-error-codes --explicit-package-bases
      - name: Pylint (type-safety checks only)
        run: pylint algo/ loaders/ utils/ config/ dashboard/ monitoring/ --disable=all --enable=comparison-with-callable,unsupported-binary-operation

  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Run test suite
        run: pytest tests/ -q

  python-security:
    name: Python security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Bandit
        run: bandit -r algo loaders config lambda --severity-level medium --confidence-level high
      - name: pip-audit (dependency CVE scan)
        run: pip-audit -r requirements.txt
      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@v3.63.0
        with:
          extra_args: --only-verified

  frontend-quality:
    name: Frontend lint + format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: webapp/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  frontend-tests:
    name: Frontend unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: webapp/frontend/package-lock.json
      - run: npm ci
      - run: npm run test:unit
